name: PT-BR Windows development
on:
  push:
    branches: [dev/low-latency-pt-br]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: C:\t
      GGML_NATIVE: 'OFF'
      CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: 'ON'
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: C:\t
          key: ptbr-cpu-v1
          cache-on-failure: true
      - name: UI syntax and regression tests
        run: |
          node --check ui/app.js
          node --check ui/overlay.js
          node --test scripts/overlay.test.cjs
      - name: Core tests
        run: cargo test -p overlaysubs-core
      - name: Build CPU application and stage DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/libs | Out-Null
          New-Item -ItemType File -Force src-tauri/libs/placeholder.dll | Out-Null
          cargo build --release -p overlaysubs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath src-tauri/libs/placeholder.dll
          Copy-Item C:\t\release\build\llama-cpp-sys-2-*\out\bin\*.dll src-tauri/libs/
          if (!(Test-Path src-tauri/libs/llama.dll)) { throw 'llama.dll missing' }
          (Resolve-Path src-tauri/libs).Path >> $env:GITHUB_PATH
      - name: Application tests
        run: cargo test --release -p overlaysubs
      - name: Package portable test runtime
        shell: pwsh
        run: |
          $lines = cargo test --release -p overlaysubs --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = @($lines | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable })
          if ($test.Count -ne 1) { throw 'Expected exactly one test executable' }
          New-Item -ItemType Directory -Force test-runtime | Out-Null
          Copy-Item $test[0].executable test-runtime/overlaysubs-tests.exe
          Copy-Item src-tauri/libs/*.dll test-runtime/
      - uses: actions/upload-artifact@v4
        with:
          name: PTBR-test-runtime
          path: test-runtime/*
      - name: Real offline models and paced English audio smoke test
        run: ./scripts/smoke-resources.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTBR-test-report
          path: |
            ptbr-smoke.json
            resource-smoke.json
            smoke-*.log
      - name: Build separate Windows installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis
      - name: Install into an isolated directory and smoke launch
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem C:\t\release\bundle\nsis\*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S','/D=C:\overlaysubs-ptbr-smoke' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = 'C:\overlaysubs-ptbr-smoke\overlaysubs.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Installed application exited early: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: OverlaySubs-PTBR-Windows-x64
          path: C:\t\release\bundle\nsis\*.exe
          if-no-files-found: error
